# clone naemon-core and naemon-livestatus
---
- hosts: all
  tasks:
  - debug:
      msg: "### naemon.yml"
  - name: "naemon-core build requirements"
    yum:
      name:
        - autoconf
        - automake
        - pkgconfig
        - help2man
        - gperf
        - libtool
        - gcc
        - chrpath
        - glib2-devel
        - check
        - check-devel
        - perl-Test-Simple
      state: installed
  - name: "naemon-livestatus build requirements"
    yum:
      name:
        - libasan
        - gcc-c++
        - libicu-devel
        - cppunit-devel
        - python3-flake8
        - python3-behave
      state: installed
  - name: "replace naemon binary path in init script"
    lineinfile:
        dest: /omd/sites/dev/etc/init.d/naemon
        state: present
        regexp: '^DAEMON'
        line: 'DAEMON=/src/naemon-core/src/naemon/naemon'
  - name: "replace naemon binary path in init script II"
    lineinfile:
        dest: /omd/sites/dev/etc/init.d/naemon
        state: present
        regexp: '^# BINARY:'
        line: '# BINARY: .libs/lt-naemon'
  - name: "set library path in init script"
    lineinfile:
        dest: /omd/sites/dev/etc/init.d/naemon
        state: present
        regexp: '^export LD_LIBRARY_PATH'
        line: 'export LD_LIBRARY_PATH=/src/gearmand/dest~/lib/'
        insertbefore: '^NAME='
  - name: "set asan options in init script"
    lineinfile:
        dest: /omd/sites/dev/etc/init.d/naemon
        state: present
        regexp: '^export ASAN_OPTIONS'
        line: 'export ASAN_OPTIONS=log_path=$OMD_ROOT/var/tmp/naemon.asan.log'
        insertbefore: '^NAME='

  - name: "replace naemon-livestatus path in module config"
    lineinfile:
        dest: /omd/sites/dev/etc/naemon/naemon.d/livestatus.cfg
        state: present
        regexp: '^broker_module'
        line: 'broker_module=/src/naemon-livestatus/src/.libs/livestatus.so pnp_path=/omd/sites/dev/var/pnp4nagios/perfdata /omd/sites/dev/tmp/run/live'

  - name: "replace naemon-vimcrypt path in module config"
    lineinfile:
        dest: /omd/sites/dev/etc/naemon/naemon.d/vimvault.cfg
        state: present
        regexp: '^broker_module'
        line: 'broker_module=/src/naemon-vimcrypt-vault-broker/.libs/naemon_vimvault.so vault=/omd/sites/dev/etc/naemon/vault.cfg'
  - name: "set master password for naemon-vimcrypt"
    lineinfile:
        dest: /omd/sites/dev/etc/environment
        state: present
        regexp: '^NAEMON_VIM_MASTER_PASSWORD'
        line: 'NAEMON_VIM_MASTER_PASSWORD=test'
  - name: "create vimcrypt vault file"
    shell: |
      vim -Nu NONE -n -es "/omd/sites/dev/etc/naemon/vault.cfg" \
        "+set cm=blowfish2" \
        "+set key=test" \
        "+call setline(1, '\$VAULT:TESTVAR\$=test')" \
        "+wq"
      chown dev:dev "/omd/sites/dev/etc/naemon/vault.cfg"
    args:
      chdir: /src
      creates: /omd/sites/dev/etc/naemon/vault.cfg

  - name: rebuild naemon-core
    command: make build naemon-core
    args:
      chdir: /src
      creates: /src/naemon-core/src/naemon/.libs/naemon

  - name: rebuild naemon-livestatus
    command: make build naemon-livestatus
    args:
      chdir: /src
      creates: /src/naemon-livestatus/src/.libs/livestatus.so

  - name: rebuild naemon-vimvault
    command: make build naemon-vimcrypt-vault-broker
    args:
      chdir: /src
      creates: /src/naemon-vimcrypt-vault-broker/naemon_vimvault_la-module.o
