# clone thruk
---
- hosts: all
  tasks:
  - debug:
      msg: "### thruk.yml"
  - name: "thruk build requirements"
    yum:
      name:
        - make
        - perl-Module-Install
        - perl-App-cpanminus
        - perl-Cpanel-JSON-XS
        - perl-Template-Toolkit
        - perl-Plack
        - perl-Plack-Test
        - perl-Date-Calc
        - perl-Date-Manip
        - perl-Digest-SHA
        - perl-libwww-perl
        - perl-HTML-Parser
        - perl-GD
        - perl-Crypt-Rijndael
        - perl-MIME-Lite
        - perl-Log-Log4perl
        - perl-Pod-Usage
        - perl-Module-Load
        - perl-Mozilla-CA
        - perl-Test-Vars
        - perl-Test-Pod
        - perl-LWP-Protocol-https
        - perl-Test-Perl-Critic
        - perl-HTML-Lint
        - perl-IO-String
        - perl-DBD-MySQL
        - perl-Test-Pod-Coverage
        - perl-Devel-Cycle
      state: installed
  - name: "thruk build npm requirements"
    command: yum install -y npm
    args:
      creates: /usr/lib/node_modules/npm
  - name: rebuild thruk
    command: make build thruk
    args:
      chdir: /src
      creates:
        - /src/thruk/Makefile
        - /omd/sites/dev/local/lib/perl5/lib/perl5/File/ChangeNotify

  - name: add more perl modules
    shell: |
        cpanm -n \
            File::BOM \
            Devel::Gladiator \
            Excel::Template \
            FCGI \
            HTML::Escape \
            LWP::Protocol::connect \
            Perl::Critic::Policy::Dynamic::NoIndirect \
            Perl::Critic::Policy::Modules::ProhibitPOSIXimport \
            Perl::Critic::Policy::NamingConventions::ProhibitMixedCaseSubs \
            Perl::Critic::Policy::TooMuchCode::ProhibitUnusedImport \
            Perl::Critic::Policy::ValuesAndExpressions::ProhibitAccessOfPrivateData \
            Test::Cmd \
            Tie::IxHash
    args:
      creates: /usr/local/share/perl5/*/File/BOM.pm

- hosts: all
  become: true
  become_user: dev
  become_method: su
  become_flags: '-l'
  tasks:
  - name: "activate local thruk"
    shell: "yes | /src/omd_utils/thruk_developer/install.sh /src/thruk"

  - name: "activate thruk agents plugin"
    shell: "thruk plugin enable agents"
    args:
      creates: /omd/sites/dev/etc/thruk/plugins-enable/agents

  - name: "copy agents example config"
    shell: cp /src/thruk/t/scenarios/agents-plugin/http-backend/agents.cfg /omd/sites/dev/etc/thruk/thruk_local.d/agents.cfg

  - name: "activate thruk node-control plugin"
    shell: "thruk plugin enable node-control"
    args:
      creates: /omd/sites/dev/etc/thruk/plugins-enable/node-control

  - name: "activate thruk omd plugin"
    shell: "thruk plugin enable omd"
    args:
      creates: /omd/sites/dev/etc/thruk/plugins-enable/omd
